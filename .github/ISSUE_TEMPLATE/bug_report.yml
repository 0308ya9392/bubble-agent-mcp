name: Bug report
description: Report a reproducible problem with Bubble Agent MCP.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, project secrets, or private conversation data.
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: Claude Desktop, Codex, Cursor…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials and private workspace data before posting.
